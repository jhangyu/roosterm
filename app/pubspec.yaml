name: roosterm
description: "Android WebView shell that lists roosterm hosts and opens one."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  shared_preferences: ^2.5.6
  flutter_svg: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false

  assets:
    - assets/icons/
