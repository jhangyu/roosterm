name: Android
on:
  push:
    tags: ["app-v*"]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test guard
        run: python3 scripts/ci.py guard
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: "3.44.6"
      - name: Build
        run: python3 scripts/ci.py build android
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci.py release android
