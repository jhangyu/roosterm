        <line x1="209" y1="187" x2="138" y2="146"/>
      </g>
      <circle cx="256" cy="214" r="24" fill="url(#c2-slate)"/>
      <rect x="300" y="384" width="132" height="46" rx="16" fill="url(#c2-slate)"/>
