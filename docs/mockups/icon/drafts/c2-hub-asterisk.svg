<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="clip-tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="g-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="f-softlight" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7a2e12" flood-opacity=".22"/></filter>
    <linearGradient id="c2-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7F0"/><stop offset="1" stop-color="#F8D6C2"/></linearGradient>
    <linearGradient id="c2-arm" gradientUnits="userSpaceOnUse" x1="120" y1="70" x2="390" y2="360"><stop offset="0" stop-color="#F38A5C"/><stop offset="1" stop-color="#C2432A"/></linearGradient>
    <linearGradient id="c2-slate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C4252"/><stop offset="1" stop-color="#22252F"/></linearGradient>
  </defs>
